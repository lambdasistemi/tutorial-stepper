name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: nixos
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint a scoped token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: ${{ github.event.repository.name }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    name: Release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: nixos
    steps:
      - name: Mint a scoped token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Linux binaries and their checksum
        id: build
        working-directory: checkout
        run: |
          set -euo pipefail
          out="$(nix build --quiet --print-out-paths .#release-artifacts)"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload the binaries and the checksum
        working-directory: checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          nix --quiet shell nixpkgs#gh -c gh release upload "$TAG" "$OUT"/* --clobber

  macos-release:
    name: macOS release
    needs:
      - release-please
      - release-assets
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://paolino.cachix.org
            extra-trusted-public-keys = paolino.cachix.org-1:ecmgO3CXdgSWA2cHlm4srknd/cLFMLmK3i3NrzeDFaE=
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Apple Silicon tarball
        run: bash scripts/build-darwin.sh "$RUNNER_TEMP/darwin"
      - name: Mint a token for this release
        id: release-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: ${{ github.event.repository.name }}
      - name: Upload the tarball and rewrite the checksum
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/publish-release-assets.sh "$TAG" "$RUNNER_TEMP/darwin"
      - name: Mint a token for the tap
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: homebrew-tap
      - name: Push the Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/push-homebrew-formula.sh "$TAG" "$RUNNER_TEMP/darwin"
