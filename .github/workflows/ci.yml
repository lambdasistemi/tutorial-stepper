name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Warm the Nix store
        working-directory: checkout
        run: >-
          nix build --quiet
          .#default
          .#tutorial-stepper-static
          .#tutorial-stepper-static-aarch64
          .#release-artifacts
          .#checks.x86_64-linux.release-binaries
          .#checks.x86_64-linux.clippy
          .#checks.x86_64-linux.nextest
          .#checks.x86_64-linux.fmt
          .#checks.x86_64-linux.deny
          .#checks.x86_64-linux.doc
          .#checks.x86_64-linux.version
          .#checks.x86_64-linux.homebrew-formula
          .#checks.x86_64-linux.release-checksums
          .#checks.x86_64-linux.play-conformance
          .#devShells.x86_64-linux.default.inputDerivation
      - name: Copy the Linux binaries out of the store
        working-directory: checkout
        run: |
          set -euo pipefail
          out="$(nix build --quiet --print-out-paths .#release-artifacts)"
          mkdir -p linux-binaries
          cp -L "$out"/* linux-binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: checkout/linux-binaries
          if-no-files-found: error

  format:
    name: Format
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: rustfmt
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.fmt

  clippy:
    name: Clippy
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: clippy, warnings denied
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.clippy

  tests:
    name: Tests
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: cargo-nextest
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.nextest

  supply-chain:
    name: Supply chain
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: cargo-deny
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.deny

  api-reference:
    name: API reference
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: rustdoc, warnings denied
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.doc

  development-shell:
    name: Development shell
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Test inside the development shell
        working-directory: checkout
        run: nix develop --accept-flake-config -c cargo test --locked

  release-binaries:
    name: Release binaries
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Names, checksums, and static link
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.release-binaries

  ubuntu-binaries:
    name: Ubuntu binaries
    needs: build-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux-binaries
      - name: Version and check in Ubuntu 24.04
        run: bash scripts/ubuntu-binaries.sh linux-binaries examples

  homebrew-formula:
    name: Homebrew formula
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Formula, checksum, and both shells
        working-directory: checkout
        run: >-
          nix build --quiet
          .#checks.x86_64-linux.homebrew-formula
          .#checks.x86_64-linux.release-checksums
          .#checks.x86_64-linux.play-conformance

  macos-formula:
    name: macOS formula
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://paolino.cachix.org
            extra-trusted-public-keys = paolino.cachix.org-1:ecmgO3CXdgSWA2cHlm4srknd/cLFMLmK3i3NrzeDFaE=
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install from a temporary tap and play
        run: bash scripts/macos-formula.sh
